name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Abhaengigkeiten
        run: flutter pub get

      # firebase_options.dart liegt als Platzhalter im Repo, google-services.json
      # nicht - fuer analyze und die Unit-/Widget-Tests wird beides nicht
      # gebraucht, weil kein Test Firebase initialisiert.
      - name: Analyse
        run: flutter analyze

      - name: Tests
        run: flutter test

  functions:
    name: functions build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Die Rules-Tests brauchen den Firestore-Emulator (Java) und laufen
      # deshalb in einem eigenen Schritt.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npx firebase-tools emulators:exec --only firestore --project trueglow-regeltest "npx vitest run --config vitest.rules.config.ts"
