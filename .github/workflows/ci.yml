name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Abhaengigkeiten
        run: flutter pub get

      # analyze und die Unit-/Widget-Tests brauchen keine Firebase-Konfiguration,
      # weil kein Test Firebase initialisiert. `android/app/google-services.json`
      # fehlt hier also folgenlos; `lib/firebase_options.dart` und die iOS-Fassung
      # `ios/Runner/GoogleService-Info.plist` liegen im Repo (DECISIONS 96).
      - name: Analyse
        run: flutter analyze

      - name: Tests
        run: flutter test

  functions:
    name: functions build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Muss zu "engines" in functions/package.json passen - dort steht 22,
          # und auf 22 laufen die Functions auch bei Firebase. Hier stand bis
          # zum 03.09.2026 die 20.
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Die Rules-Tests brauchen den Firestore-Emulator (Java) und laufen
      # deshalb in einem eigenen Schritt.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 und nicht 17: firebase-tools ab 15.x bricht mit
          # 'no longer supports Java version before 21' ab, bevor der
          # Emulator ueberhaupt startet. Aufgefallen am 03.09.2026 im
          # ersten CI-Lauf, der diesen Schritt erreicht hat (DECISIONS 99).
          java-version: '21'
      - name: Rules-Tests gegen den Emulator
        run: |
          set -o pipefail
          npx firebase-tools emulators:exec --only firestore --project trueglow-regeltest "npx vitest run --config vitest.rules.config.ts" 2>&1 | tee emulator.log

      # Warum dieser Schritt existiert: Das Protokoll eines Laufs ist nur mit
      # GitHub-Anmeldung lesbar. Die Anmerkungen einer fehlgeschlagenen
      # Pruefung sind es ohne. Ohne ihn steht bei einem Fehlschlag nach aussen
      # nur "Process completed with exit code 1" und man muss raten
      # (DECISIONS 98).
      - name: Fehler sichtbar machen
        if: failure()
        run: |
          tail -80 emulator.log || true
          MSG=$(tail -50 emulator.log | tr -d '\015' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Rules-Tests gescheitert::${MSG}"

  # ---------------------------------------------------------------------------
  # iOS: baut die App auf einem Mac-Mietrechner von GitHub. Fuer oeffentliche
  # Repos sind diese Rechner kostenlos; bei einem privaten Repo zaehlt jede
  # Mac-Minute zehnfach.
  #
  # `--no-codesign` heisst: bauen ohne zu signieren. Genau deshalb laeuft der
  # Auftrag schon jetzt – ein Apple-Developer-Konto gibt es noch nicht. Was er
  # findet, sind die Fehler, die sonst erst beim ersten Upload auftauchen:
  # Pods, die sich auf iOS 15 nicht bauen, Plugins ohne iOS-Umsetzung,
  # Swift-Versionen, Berechtigungen.
  #
  # Nicht gedeckt: Signieren, Provisioning, App Store Connect. Das kommt,
  # sobald das Konto steht (SETUP.md 7).
  ios:
    name: iOS-Bau (unsigniert)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Abhaengigkeiten
        run: flutter pub get

      # GoogleService-Info.plist liegt seit DECISIONS 96 im Repo, es muss also
      # nichts entpackt werden. Zur Laufzeit gebraucht wird sie hier ohnehin
      # nicht - der Auftrag baut, er startet die App nicht.
      - name: CocoaPods-Fassungen anzeigen
        run: |
          pod --version
          xcodebuild -version

      - name: iOS bauen
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee ios-build.log

      # Warum dieser Schritt existiert: Das Protokoll eines Laufs ist nur mit
      # GitHub-Anmeldung lesbar. Die Anmerkungen einer fehlgeschlagenen
      # Pruefung sind es ohne. Ohne ihn steht bei einem Fehlschlag nach aussen
      # nur "Process completed with exit code 1" und man muss raten
      # (DECISIONS 98).
      - name: Fehler sichtbar machen
        if: failure()
        run: |
          tail -80 ios-build.log || true
          MSG=$(tail -50 ios-build.log | tr -d '\015' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=iOS-Bau gescheitert::${MSG}"

      # Damit sich die Groesse ueber die Zeit verfolgen laesst und im Fehlerfall
      # sichtbar ist, ob ueberhaupt etwas entstanden ist.
      #
      # Der zweite Teil beantwortet eine Frage, die "uebersetzt ohne Fehler"
      # NICHT beantwortet: ob die drei ML-Kit-Pakete wirklich im Paket sind.
      # Sie kommen als einzige ueber CocoaPods statt ueber Swift Package
      # Manager, und genau diese Verdrahtung war bis zum 03.09.2026 nicht
      # gesetzt (DECISIONS 103). Ergebnis als Hinweis-Anmerkung, weil die auch
      # ohne GitHub-Anmeldung lesbar ist.
      - name: Ergebnis
        run: |
          APP=build/ios/iphoneos/Runner.app
          du -sh "$APP"
          echo "--- Frameworks im Paket ---"
          ls "$APP/Frameworks" 2>/dev/null || echo "(kein Frameworks-Ordner)"
          echo "--- Spuren von ML Kit ---"
          SPUREN=$(find "$APP" -iname "*mlkit*" -o -iname "*MLImage*" \
            -o -iname "*face*detect*" 2>/dev/null | head -20)
          echo "${SPUREN:-keine}"
          MSG=$(printf '%s' "${SPUREN:-keine gefunden}" \
            | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=ML Kit im App-Paket::${MSG}"

  # ---------------------------------------------------------------------------
  # Bildschirmfotos fuer den App Store.
  #
  # Laeuft NICHT bei jedem Commit: Ein Simulator-Durchlauf kostet gut zehn
  # Mac-Minuten, und die Bilder aendern sich nur, wenn sich die Oberflaeche
  # aendert. Ausgeloest wird er, indem "[fotos]" in der Commit-Zeile steht.
  # (Ein Knopf in der Actions-Oberflaeche waere eleganter, verlangt aber eine
  # GitHub-Anmeldung - und die hat nicht jeder, der hier arbeitet.)
  #
  # TRUEGLOW_MOCK=true ist Pflicht und nicht Bequemlichkeit: Ohne den Schalter
  # liefe jeder Durchlauf gegen die echte Analyse, verbrauchte Kontingent und
  # Tokens - und die Bilder saehen bei jedem Lauf anders aus.
  fotos:
    name: App-Store-Bildschirmfotos
    if: contains(github.event.head_commit.message, '[fotos]')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Abhaengigkeiten
        run: flutter pub get

      # Der groesste verfuegbare iPhone-Simulator. Apple verlangt fuer den
      # Store einen Satz in 6,9 Zoll; das ist die Pro-Max-Reihe. Welche
      # Modelle der Mietrechner mitbringt, haengt an seiner Xcode-Fassung -
      # deshalb wird gesucht statt geraten.
      - name: Simulator waehlen und starten
        id: sim
        run: |
          set -o pipefail
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available \
            | grep -E "iPhone .*Pro Max" \
            | tail -1 \
            | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/') || true
          if [ -z "$UDID" ]; then
            echo "Kein Pro-Max-Simulator gefunden. Vorhanden:"
            xcrun simctl list devices available | grep iPhone || true
            exit 1
          fi
          echo "Gewaehlt: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      # Trennt zwei Fragen, die im ersten Anlauf vermischt waren: Scheitert
      # der Simulator-Bau an sich, oder erst am Zusammenspiel mit
      # flutter drive? Bricht dieser Schritt ab, ist der Treiber unschuldig.
      - name: Simulator-Bau einzeln
        run: |
          set -o pipefail
          flutter build ios --simulator --debug 2>&1 | tee simbau.log

      # Laeuft auch nach einem Fehlschlag, denn genau dann wird sie gebraucht.
      - name: Beweismittel sichern
        if: always()
        run: |
          {
            echo "### ios/Flutter/Debug.xcconfig"
            cat ios/Flutter/Debug.xcconfig || true
            echo "### Podfile.lock vorhanden?"
            ls -la ios/Podfile.lock ios/Pods/Manifest.lock 2>&1 || true
            echo "### Target Support Files"
            ls "ios/Pods/Target Support Files" 2>&1 || true
            echo "### Linker-Zeilen aus Pods-Runner.debug.xcconfig"
            grep -E "OTHER_LDFLAGS|FRAMEWORK_SEARCH_PATHS|LIBRARY_SEARCH_PATHS" \
              "ios/Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig" 2>&1 || true
            echo "### Was heisst das Pods-Ergebnis - Framework oder Bibliothek?"
            find ios/Pods -maxdepth 3 -name "Pods_Runner*" -o -name "libPods-Runner*" 2>/dev/null || true
            echo "### Workspace"
            cat ios/Runner.xcworkspace/contents.xcworkspacedata || true
            echo "### Letzte Zeilen des Simulator-Baus"
            tail -25 simbau.log 2>/dev/null || echo "(kein simbau.log)"
          } > beweise.txt 2>&1
          cat beweise.txt
          MSG=$(tail -90 beweise.txt | tr -d '\015' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Beweismittel Simulator-Bau::${MSG}"

      - name: Durchlauf und Aufnahmen
        run: |
          set -o pipefail
          flutter drive \
            --driver=test_driver/bildschirmfotos_driver.dart \
            --target=integration_test/bildschirmfotos_test.dart \
            -d ${{ steps.sim.outputs.udid }} \
            --dart-define=TRUEGLOW_MOCK=true 2>&1 | tee fotos.log

      - name: Was entstanden ist
        run: |
          ls -la store/screenshots/ios/ || true
          for f in store/screenshots/ios/*.png; do
            [ -e "$f" ] || continue
            echo "$f: $(sips -g pixelWidth -g pixelHeight "$f" \
              | tr '\n' ' ')"
          done

      # Ins Repo statt als Artefakt: Ein Artefakt laesst sich nur mit
      # GitHub-Anmeldung herunterladen, eine Datei im oeffentlichen Repo von
      # jedem ansehen (DECISIONS 98, gleiche Ursache wie beim Protokoll).
      # "[skip ci]" verhindert, dass dieser Commit die CI erneut ausloest.
      - name: Bilder einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/screenshots/ios/
          if git diff --cached --quiet; then
            echo "Keine Aenderung an den Bildern."
            exit 0
          fi
          git commit -m "Bildschirmfotos neu aufgenommen [skip ci]"
          git push

      - name: Fehler sichtbar machen
        if: failure()
        run: |
          tail -80 fotos.log || true
          MSG=$(tail -50 fotos.log | tr -d '\015' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Bildschirmfotos gescheitert::${MSG}"
