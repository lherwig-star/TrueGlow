name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Abhaengigkeiten
        run: flutter pub get

      # analyze und die Unit-/Widget-Tests brauchen keine Firebase-Konfiguration,
      # weil kein Test Firebase initialisiert. `android/app/google-services.json`
      # fehlt hier also folgenlos; `lib/firebase_options.dart` und die iOS-Fassung
      # `ios/Runner/GoogleService-Info.plist` liegen im Repo (DECISIONS 96).
      - name: Analyse
        run: flutter analyze

      - name: Tests
        run: flutter test

  functions:
    name: functions build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Muss zu "engines" in functions/package.json passen - dort steht 22,
          # und auf 22 laufen die Functions auch bei Firebase. Hier stand bis
          # zum 03.09.2026 die 20.
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Die Rules-Tests brauchen den Firestore-Emulator (Java) und laufen
      # deshalb in einem eigenen Schritt.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Rules-Tests gegen den Emulator
        run: |
          set -o pipefail
          npx firebase-tools emulators:exec --only firestore --project trueglow-regeltest "npx vitest run --config vitest.rules.config.ts" 2>&1 | tee emulator.log

      # Warum dieser Schritt existiert: Das Protokoll eines Laufs ist nur mit
      # GitHub-Anmeldung lesbar. Die Anmerkungen einer fehlgeschlagenen
      # Pruefung sind es ohne. Ohne ihn steht bei einem Fehlschlag nach aussen
      # nur "Process completed with exit code 1" und man muss raten
      # (DECISIONS 98).
      - name: Fehler sichtbar machen
        if: failure()
        run: |
          tail -80 emulator.log || true
          MSG=$(tail -50 emulator.log | tr -d '\015' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Rules-Tests gescheitert::${MSG}"

  # ---------------------------------------------------------------------------
  # iOS: baut die App auf einem Mac-Mietrechner von GitHub. Fuer oeffentliche
  # Repos sind diese Rechner kostenlos; bei einem privaten Repo zaehlt jede
  # Mac-Minute zehnfach.
  #
  # `--no-codesign` heisst: bauen ohne zu signieren. Genau deshalb laeuft der
  # Auftrag schon jetzt – ein Apple-Developer-Konto gibt es noch nicht. Was er
  # findet, sind die Fehler, die sonst erst beim ersten Upload auftauchen:
  # Pods, die sich auf iOS 15 nicht bauen, Plugins ohne iOS-Umsetzung,
  # Swift-Versionen, Berechtigungen.
  #
  # Nicht gedeckt: Signieren, Provisioning, App Store Connect. Das kommt,
  # sobald das Konto steht (SETUP.md 7).
  ios:
    name: iOS-Bau (unsigniert)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Abhaengigkeiten
        run: flutter pub get

      # GoogleService-Info.plist liegt seit DECISIONS 96 im Repo, es muss also
      # nichts entpackt werden. Zur Laufzeit gebraucht wird sie hier ohnehin
      # nicht - der Auftrag baut, er startet die App nicht.
      - name: CocoaPods-Fassungen anzeigen
        run: |
          pod --version
          xcodebuild -version

      - name: iOS bauen
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee ios-build.log

      # Warum dieser Schritt existiert: Das Protokoll eines Laufs ist nur mit
      # GitHub-Anmeldung lesbar. Die Anmerkungen einer fehlgeschlagenen
      # Pruefung sind es ohne. Ohne ihn steht bei einem Fehlschlag nach aussen
      # nur "Process completed with exit code 1" und man muss raten
      # (DECISIONS 98).
      - name: Fehler sichtbar machen
        if: failure()
        run: |
          tail -80 ios-build.log || true
          MSG=$(tail -50 ios-build.log | tr -d '\015' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=iOS-Bau gescheitert::${MSG}"

      # Damit sich die Groesse ueber die Zeit verfolgen laesst und im Fehlerfall
      # sichtbar ist, ob ueberhaupt etwas entstanden ist.
      - name: Ergebnis
        run: du -sh build/ios/iphoneos/Runner.app
