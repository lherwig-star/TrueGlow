name: trueglow
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Offizielle Flutter-Lokalisierung. `flutter_localizations` bringt die
  # uebersetzten Material-/Cupertino-Texte und die Datums- und Zahlformate
  # mit; `intl` ist die Laufzeit hinter den generierten ARB-Klassen.
  flutter_localizations:
    sdk: flutter
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  image: ^4.9.2
  google_mlkit_face_detection: ^0.15.1
  # Auto-Ausloeser fuer die Ganzkoerperfotos: erkennt, wann jemand
  # vollstaendig und mittig im Bild steht. Teilt sich google_mlkit_commons
  # ^0.13.0 mit der Gesichtserkennung – deshalb diese Fassung.
  google_mlkit_pose_detection: ^0.16.1
  # Signalton des Countdowns. Laeuft ueber den Benachrichtigungs-Kanal, damit
  # der Lautlos-Modus des Geraets ihn stummschaltet, ohne dass die App den
  # Klingelzustand abfragen muesste.
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  go_router: ^17.5.0
  camera: ^0.12.0+2
  permission_handler: 12.0.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  # Auf 4.13.x festgenagelt: In 4.14.0 ist FlutterFirebaseCorePlugin von Java
  # nach Kotlin gewandert und das Feld customAuthDomain in eine andere Klasse.
  # firebase_auth 6.5.7 sucht es noch am alten Ort, und die Fassung, die das
  # behebt (6.6.0), scheitert ihrerseits am Kotlin-Compiler. Siehe
  # DECISIONS.md, Abschnitt 29.
  firebase_core: '>=4.13.0 <4.14.0'
  firebase_auth: 6.5.7
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.6
  firebase_app_check: ^0.4.6
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.1
  firebase_crashlytics: ^5.2.7
  firebase_analytics: '>=12.0.0 <12.5.0'
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Treibt die App auf einem echten Geraet durch den Hauptpfad.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # Reiner Generator: `dart run flutter_native_splash:create`. Die Laufzeit-
  # Funktionen `preserve`/`remove` sind seit DECISIONS 55 wieder draussen –
  # sie waren die Ursache des Blinkens.
  flutter_native_splash: ^2.4.8
flutter:

  # Erzeugt die Klasse `L` aus lib/l10n/*.arb. Einstellungen in l10n.yaml.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Bewusst ohne .env-Asset: Der Gemini-Key liegt seit dem Umbau auf Cloud
  # Functions im Secret Manager und erreicht die App nie. Ein Asset waere aus
  # jedem APK auslesbar.

  assets:
    # Signaltoene des Auto-Ausloesers. Erzeugt von tool/toene_erzeugen.dart –
    # nicht von Hand bearbeiten, der naechste Lauf ueberschreibt sie.
    - assets/toene/
    # Datenschutz, Nutzungsbedingungen, Impressum – je Sprache eine Datei.
    # Sie liegen im Bundle und nicht nur im Netz, damit sie auch ohne
    # Verbindung lesbar sind (SECURITY_AUDIT F2).
    - assets/rechtstexte/
    # Die Wissens-Bibliothek: feste Erklaerungen zu jeder Technik, je Sprache
    # eine Datei. Im Bundle und nicht im Netz, damit das Nachschlagen weder
    # Geld noch eine Verbindung kostet (DECISIONS 88).
    - assets/wissen/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# --- Markenauftritt ---------------------------------------------------------
#
# Beide Konfigurationen lesen die Dateien aus assets/branding/. Erzeugt werden
# die von tool/marke_erzeugen.dart – dort steht die Geometrie, hier nur, was
# damit geschieht.
#
#   dart run tool/marke_erzeugen.dart
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  # Adaptives Icon: Der Launcher schneidet den Vordergrund je nach Geraet
  # rund, eckig oder als Tropfen zu. Deshalb liegt das Motiv dort auf 62 %.
  #
  # Der Hintergrund ist seit DECISIONS 54 ein Bild und keine Farbe mehr: Die
  # Kachel traegt den Petrol-Verlauf der App, und einen Verlauf kann eine
  # Farbangabe nicht.
  adaptive_icon_background: assets/branding/app_icon_hintergrund.png
  adaptive_icon_foreground: assets/branding/app_icon_vordergrund.png
  adaptive_icon_monochrome: assets/branding/app_icon_vordergrund.png
  # iOS erlaubt keine Transparenz im App-Icon.
  remove_alpha_ios: true

flutter_native_splash:
  # #122C31 ist die Mitte des Seitenverlaufs – genau der Ton, den die App an
  # der Stelle traegt, an der das Zeichen steht. Ein flaches Petrol (#173C3B)
  # stand hier bis zum 26.08.2026 und sah neben dem neuen dunklen Design alt
  # aus; Begruendung in DECISIONS 52.
  #
  # Ein Verlauf ginge hier nicht: `windowSplashScreenBackground` nimmt ab
  # Android 12 nur eine einzelne Farbe. Die Mitte ist deshalb der beste
  # Kompromiss – dort, wo der Blick liegt, stimmt sie auf den Punkt.
  #
  # Immer derselbe Ton – auch dann, wenn das Handy im hellen Schema steht.
  # Der native Splash kann nur dem System folgen; die App richtet sich aber
  # nach ihrer eigenen Einstellung, und die steht standardmaessig auf dunkel
  # (`ThemeController.standard`). Ein Splash, der dem System folgt, hiesse auf
  # jedem hell gestellten Handy: Mocha-Grund, dann ein Sprung ins Dunkle, bei
  # jedem Kaltstart. Deshalb hier eine Farbe fuer beide Schemata.
  #
  # Wer in den Einstellungen auf "Hell" umstellt, sieht den Sprung dafuer
  # andersherum – das ist die kleinere Gruppe und eine bewusste Wahl. Die
  # saubere Loesung waere, die Theme-Wahl fuer die Android-Seite lesbar
  # abzulegen; das ist Nativ-Code fuer eine halbe Sekunde Bildschirm.
  color: "#122C31"
  image: assets/branding/splash_dunkel.png
  color_dark: "#122C31"
  image_dark: assets/branding/splash_dunkel.png

  # Ab Android 12 zeichnet das System den Splash selbst und zeigt nur die
  # inneren zwei Drittel der Grafik – dafuer gibt es eigene Dateien.
  # Bewusst OHNE `icon_background_color`: Mit gesetztem Symbol-Hintergrund
  # zeichnet Android das Startsymbol in eine Flaeche von 240 dp, ohne ihn in
  # 288 dp. Am Geraet nachgemessen wurden 288 dp – der Eintrag stand also
  # frueher da, ohne zu wirken, und haette beim naechsten Lesen in die Irre
  # gefuehrt. `Marke.splashFlaecheDp` rechnet mit 288.
  android_12:
    color: "#122C31"
    image: assets/branding/splash_android12_dunkel.png
    color_dark: "#122C31"
    image_dark: assets/branding/splash_android12_dunkel.png

  android: true
  ios: true
  web: false
